<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main class="mx-auto max-w-3xl p-4"><div id="root"></div></main><pre hidden id="b6-test-result">pending</pre><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import Publicacion from '/src/components/runs/PublicacionCapacidad.jsx';
import '/src/index.css';
const cap={id:'11111111-1111-4111-8111-111111111111',name:'Texto limpio',owner_username:'autora'};
const version={id:'22222222-2222-4222-8222-222222222222',name:'Texto limpio',status:'enabled',publication_id:null,license:null,contracts:{input_schema:{type:'object',required:['texto'],properties:{texto:{type:'string'}},additionalProperties:false},parameter_schema:{type:'object',properties:{},additionalProperties:false}}};
const pub='33333333-3333-4333-8333-333333333333',run='44444444-4444-4444-8444-444444444444';
const requests=[],nativeFetch=window.fetch.bind(window);let enabled=true,failRun=true,navigation;
window.fetch=async(url,options={})=>{
 const parsed=new URL(url,location.origin),path=parsed.pathname,method=options.method||'GET';
 if(!path.startsWith('/api/')){if(parsed.origin===location.origin)return nativeFetch(url,options);throw Error('remote_blocked')}
 const body=options.body&&JSON.parse(options.body);requests.push({path,method,body,key:options.headers?.['Idempotency-Key']});let data;
 if(path==='/api/publications/availability')data={enabled};
 else if(path==='/api/publications'&&method==='GET')data={items:[version],next_cursor:null};
 else if(path==='/api/publications'&&method==='POST'){version.publication_id=pub;version.license=body.license;data=version;}
 else if(path.endsWith('/withdraw')){version.publication_id=null;data={withdrawn:true};}
 else if(path.endsWith('/runs')){if(failRun){failRun=false;throw Error('conexion_interrumpida')}data={id:run,status:'queued'};}
 else throw Error('unexpected_request');
 return new Response(JSON.stringify({data}),{status:200,headers:{'Content-Type':'application/json'}});
};
const root=createRoot(document.getElementById('root'));
const render=(own,key)=>root.render(React.createElement(Publicacion,{key,capacidad:cap,propia:own,onCambiarSeccion:path=>{navigation=path;}}));
const wait=async(fn)=>{for(let i=0;i<120;i++){if(fn())return;await new Promise(r=>setTimeout(r,50))}throw Error('timeout')};
const button=text=>[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===text);
const assert=(value,message)=>{if(!value)throw Error(message)};
try {
 render(true,'owner');await wait(()=>button('Consultar versiones para compartir'));button('Consultar versiones para compartir').click();await wait(()=>button('Publicar esta versión'));
 assert(button('Publicar esta versión').disabled,'missing_consent_gate');document.querySelector('input[type=checkbox]').click();await wait(()=>!button('Publicar esta versión').disabled);button('Publicar esta versión').click();await wait(()=>button('Retirar publicación'));
 assert(requests.find(r=>r.method==='POST').body.consent===true,'consent_not_sent');
 render(false,'other');await wait(()=>button('Consultar versión publicada'));button('Consultar versión publicada').click();await wait(()=>button('Ejecutar con mis datos'));
 assert(button('Ejecutar con mis datos').disabled,'execution_without_confirmation');const textarea=document.querySelector('textarea');Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,'value').set.call(textarea,'  Café nuevo  ');textarea.dispatchEvent(new Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,100));[...document.querySelectorAll('input[type=checkbox]')].at(-1).click();await wait(()=>!button('Ejecutar con mis datos').disabled);button('Ejecutar con mis datos').click();await wait(()=>document.body.textContent.includes('conexion_interrumpida'));button('Ejecutar con mis datos').click();await wait(()=>navigation==='historial/'+run);
 const posts=requests.filter(r=>r.path.endsWith('/runs'));assert(posts.length===2&&posts[0].key===posts[1].key&&posts[0].body.inputs.texto==='  Café nuevo  ','retry_or_inputs_changed');
 render(true,'withdraw');await wait(()=>button('Consultar versiones para compartir'));button('Consultar versiones para compartir').click();await wait(()=>button('Retirar publicación'));window.confirm=()=>true;button('Retirar publicación').click();await wait(()=>button('Publicar esta versión'));assert(button('Publicar esta versión').disabled,'withdraw_reused_consent');
 assert(!requests.some(r=>r.path.includes('/candidates')||r.path.includes('/builds')),'private_candidate_requested');
 enabled=false;render(true,'disabled');await new Promise(r=>setTimeout(r,100));await wait(()=>button('Consultar versiones para compartir'));button('Consultar versiones para compartir').click();await wait(()=>document.querySelector('[role=alert]'));assert(document.body.textContent.includes('pendiente de activar'),'disabled_hidden');
 assert(document.documentElement.scrollWidth<=innerWidth+2,'overflow');
 document.getElementById('b6-test-result').textContent=JSON.stringify({passed:true,explicit_publish:true,execution_confirmed:true,transport_idempotency:true,withdraw:true,no_candidate_access:true,disabled_explicit:true,no_overflow:true});
}catch(error){document.getElementById('b6-test-result').textContent=JSON.stringify({passed:false,error:error.message})}
</script></body></html>
